            dropInstant.addEventListener(ev, dragOutHandler);
        });
        dropZone.addEventListener('dragover', (e) => dragOverHandler(e, e.target));
        [...dropZone.children].forEach(c => c.addEventListener('dragover', (e) => dragOverHandler(e, dropZone)));
        dropInstant.addEventListener('dragover', (e) => dragOverHandler(e, e.target));
        [...dropInstant.children].forEach(c => c.addEventListener('dragover', (e) => dragOverHandler(e, dropInstant)));
        dropInstant.addEventListener('drop', (e) => dropHandler(e, true));
        dropZone.addEventListener('drop', (e) => dropHandler(e, false));
        dropZone.addEventListener('click', () => { fileInput.click(); instant_processing = false; });
        fileInput.addEventListener('change', function(e) {
            var files = e.target.files;
            for (var i = 0; i < files.length; i++) {
                last_file = (i + 1 === files.length);
                handleFile(files[i]);
            }
        });
    }

    function dropHandler(e, instant) {
        e.preventDefault();
        document.querySelectorAll('.drop_zone_active').forEach(el => el.classList.remove('drop_zone_active'));
        instant_processing = instant;
        if (e.dataTransfer.items) {
            [...e.dataTransfer.items].forEach((item, idx) => {
                if (item.kind === 'file') {
                    var f = item.getAsFile();
                    last_file = (idx + 1 === e.dataTransfer.items.length);
                    handleFile(f);
                }
            });
        } else {
            [...e.dataTransfer.files].forEach((f, idx) => {
                last_file = (idx + 1 === e.dataTransfer.files.length);
                handleFile(f);
            });
        }
    }

    function dragOverHandler(e, target) {
        target.classList.add('drop_zone_active');
        e.preventDefault();
    }

    function dragOutHandler(e) {
        e.target.classList.remove('drop_zone_active');
        e.preventDefault();
    }

    function update_progress(p) {
        if (p < 0) {
            p_scale.style.width = '0%';
            p_scale.parentElement.style.opacity = 0;
        } else {
            p_scale.parentElement.style.opacity = 1;
            p_scale.style.width = p + '%';
        }
    }

    window.addEventListener('DOMContentLoaded', initialize_page);

    const err_default = "请使用 *.3mf 或 *.gcode.3mf 切片文件。";

    function reject_file(msg) { alert(msg); my_files.pop(); }

    function adj_field_length(el, min, max) {
        var val = el.value || el.placeholder;
        el.style.width = Math.min(max, Math.max(min, val.length + 2)) + 'ch';
    }

    function custom_file_name(el) { if (!el.value) { el.value = el.placeholder; el.select(); } }

    async function handleFile(file) {
        var idx = my_files.length;
        var fileNameInput = document.getElementById('file_name');
        if (idx === 0) fileNameInput.placeholder = file.name.split('.gcode.').join('.').split('.3mf')[0] || 'output';
        adj_field_length(fileNameInput, 5, 26);
        my_files.push(file);
        try {
            var zip = await JSZip.loadAsync(file);
            var configText = await zip.file("Metadata/model_settings.config").async("text");
            var configXml = parser.parseFromString(configText, "text/xml");
            var plates = configXml.getElementsByTagName("plate");
            if (!plates.length || !plates[0].querySelectorAll("[key='gcode_file']").length) {
                reject_file(err_default);
                return;
            }
            document.getElementById('drop_zones_wrapper').classList.add('mini_drop_zone');
            document.getElementById('action_buttons').classList.remove('hidden');
            document.getElementById('statistics').classList.remove('hidden');

            var sliceInfoText = await zip.file("Metadata/slice_info.config").async("text");
            var sliceXml = parser.parseFromString(sliceInfoText, "text/xml");

            for (var p = 0; p < plates.length; p++) {
                (function(plateNode) {
                    var gcodeFile = plateNode.querySelectorAll("[key='gcode_file']")[0].getAttribute("value");
                    if (!gcodeFile) return;
                    var gcodeEntry = zip.file(gcodeFile);
                    if (!gcodeEntry) return;
                    var li = li_prototype.cloneNode(true);
                    li.removeAttribute('id');
                    li.style.display = 'flex';
                    playlist_ol.appendChild(li);
                    var fName = li.querySelector('.f_name');
                    var pName = li.querySelector('.p_name');
                    var icon = li.querySelector('.p_icon');
                    var fId = li.querySelector('.f_id');
                    var pTime = li.querySelector('.p_time');
                    var filamentsContainer = li.querySelector('.p_filaments');
                    var protoFil = li.querySelector('.p_filament_prototype');
                    filamentsContainer.innerHTML = '';
                    fName.textContent = file.name;
                    fName.title = file.name;
                    pName.textContent = gcodeFile.replace(/Metadata\//g, '').replace(/\.gcode/g, '');
                    pName.title = gcodeFile;
                    fId.title = idx;
                    fId.innerText = '[' + idx + ']';
                    var thumbName = plateNode.querySelectorAll("[key='thumbnail_file']")[0].getAttribute("value");
                    var thumbFile = zip.file(thumbName);
                    if (thumbFile) {
                        thumbFile.async('blob').then(blob => { icon.src = URL.createObjectURL(blob); });
                    }
                    var indexKey = "[key='index'][value='" + (p + 1) + "']";
                    var plateSlice = sliceXml.querySelectorAll(indexKey);
                    var plateSliceNode = plateSlice.length ? plateSlice[0].parentElement : sliceXml.getElementsByTagName("plate")[0];
                    var filaments = plateSliceNode.getElementsByTagName("filament");
                    for (var f = 0; f < filaments.length; f++) {
                        var clone = protoFil.cloneNode(true);
                        clone.style.display = 'flex';
                        filamentsContainer.appendChild(clone);
                        clone.querySelector('.f_color').style.backgroundColor = filaments[f].getAttribute('color');
                        clone.querySelector('.f_slot').innerText = filaments[f].getAttribute('id');
                        clone.querySelector('.f_type').innerText = filaments[f].getAttribute('type');
                        clone.querySelector('.f_used_m').innerText = filaments[f].getAttribute('used_m');
                        clone.querySelector('.f_used_g').innerText = filaments[f].getAttribute('used_g');
                        clone.className = 'p_filament';
                    }
                    gcodeEntry.async('string').then(async (gcodeStr) => {
                        var timeLabel = "total estimated time: ";
                        var start = gcodeStr.indexOf(timeLabel) + timeLabel.length;
                        var end = gcodeStr.indexOf("\n", start);
                        var timeStr = gcodeStr.substring(start, end);
                        pTime.innerText = timeStr;
                        var seconds = 0;
                        var match = timeStr.match(/(\d+)\s*s/);
                        if (match) seconds += parseInt(match[1]);
                        match = timeStr.match(/(\d+)\s*m/);
                        if (match) seconds += parseInt(match[1]) * 60;
                        match = timeStr.match(/(\d+)\s*h/);
                        if (match) seconds += parseInt(match[1]) * 3600;
                        match = timeStr.match(/(\d+)\s*d/);
                        if (match) seconds += parseInt(match[1]) * 86400;
                        pTime.title = seconds;
                        update_statistics();
                    });
                })(plates[p]);
            }

            var allFilaments = sliceXml.getElementsByTagName("filament");
            var maxId = 0;
            for (var i = 0; i < allFilaments.length; i++) {
                var id = parseInt(allFilaments[i].id);
                if (id > maxId) maxId = id;
            }
            ams_max_file_id = maxId;

            if (last_file) {
                makeListSortable(playlist_ol);
                if (instant_processing) export_3mf();
            }
        } catch (e) {
            reject_file("文件解析失败: " + e.message);
        }
    }

    async function export_3mf() {
        update_progress(5);
        var items = playlist_ol.getElementsByTagName('li');
        var gcodeList = [];
        var step = 15 / (items.length || 1);
        for (var i = 0; i < items.length; i++) {
            var fileId = items[i].querySelector('.f_id').title;
            var plateName = items[i].querySelector('.p_name').title;
            var repeats = parseInt(items[i].querySelector('.p_rep').value) || 0;
            if (repeats > 0) {
                var zip = await JSZip.loadAsync(my_files[fileId]);
                var gcode = await zip.file(plateName).async('text');
                for (var r = 0; r < repeats; r++) gcodeList.push(gcode);
            }
            update_progress(5 + (i + 1) * step);
        }
        if (!gcodeList.length) { alert('队列为空'); return; }
        var firstZip = await JSZip.loadAsync(my_files[0]);
        var plateFiles = await firstZip.file(/plate_\d+\.gcode\b$/);
        for (var pf of plateFiles) await firstZip.remove(pf.name);
        await firstZip.remove("Metadata/custom_gcode_per_layer.xml");

        var projConfig = await (await JSZip.loadAsync(my_files[ams_max_file_id] || my_files[0])).file("Metadata/project_settings.config").async("text");
        firstZip.file("Metadata/project_settings.config", projConfig);
        firstZip.file("Metadata/model_settings.config", model_settings_template);

        var sliceInfo = await firstZip.file("Metadata/slice_info.config").async("text");
        var sliceDoc = parser.parseFromString(sliceInfo, "text/xml");
        var plates = sliceDoc.getElementsByTagName("plate");
        while (plates.length > 1) plates[plates.length - 1].remove();
        var indexNode = plates[0].querySelectorAll("[key='index']")[0];
        if (indexNode) indexNode.setAttribute("value", "1");
        while (plates[0].getElementsByTagName("filament").length > 0) {
            plates[0].getElementsByTagName("filament")[0].remove();
        }
        var filamentTotal = document.getElementById('filament_total').childNodes;
        var fiArr = [];
        for (var fn = 0; fn < filamentTotal.length; fn++) {
            if (filamentTotal[fn].nodeType === 1) fiArr.push(filamentTotal[fn]);
        }
        for (var fi = 0; fi < fiArr.length; fi++) {
            var newFil = sliceDoc.createElement("filament");
            plates[0].appendChild(newFil);
            newFil.id = fiArr[fi].title || (fi + 1);
            newFil.setAttribute("used_m", "0");
            newFil.setAttribute("used_g", "0");
        }
        var sliceXmlStr = new XMLSerializer().serializeToString(sliceDoc);
        firstZip.file("Metadata/slice_info.config", sliceXmlStr);

        var typeSelect = document.querySelector('#type');
        var swapGcode = typeSelect.value === 'A2L' ? swap_gcode_A2L : swap_gcode_a1;
        for (var gi = 0; gi < gcodeList.length; gi++) gcodeList[gi] += swapGcode;

        var loops = parseInt(document.getElementById('loops').value) || 1;
        var finalGcodes = [];
        for (var l = 0; l < loops; l++) finalGcodes = finalGcodes.concat(gcodeList);
        if (finalGcodes.length) finalGcodes[0] = ini_gcode + finalGcodes[0];

        var flagStr = "\nM620 S";
        var flagIdx = [],
            flagPlate = [],
            flagVal = [];
        for (var idx = 0; idx < finalGcodes.length; idx++) {
            var pos = finalGcodes[idx].indexOf(flagStr);
            while (pos !== -1) {
                flagIdx.push(pos + 1);
                flagPlate.push(idx);
                var val = finalGcodes[idx].substring(pos + 7, pos + 10);
                if (val[2] === '\n' || val[2] === ' ') val = val.substring(0, 2);
                flagVal.push(val);
                pos = finalGcodes[idx].indexOf(flagStr, pos + 1);
            }
        }
        for (var fi2 = 0; fi2 < flagVal.length - 1; fi2++) {
            if (flagVal[fi2] == 255 && flagVal[fi2 - 1] == flagVal[fi2 + 1]) {
                finalGcodes[flagPlate[fi2]] = disable_gcode_line(finalGcodes[flagPlate[fi2]], flagIdx[fi2]);
                finalGcodes[flagPlate[fi2 + 1]] = disable_gcode_block(finalGcodes[flagPlate[fi2 + 1]], flagIdx[fi2 + 1]);
            }
        }

        var blob = new Blob(finalGcodes, { type: 'text/x-gcode' });
        firstZip.file("Metadata/plate_1.gcode", blob);
        update_progress(25);
        await chunked_md5(enable_md5 ? blob : new Blob([" "]), function(hash) {
            firstZip.file("Metadata/plate_1.gcode.md5", hash);
            firstZip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 3 } }, function(meta) {
                update_progress(75 + 0.2 * meta.percent.toFixed());
            }).then(function(outBlob) {
                var nameInput = document.getElementById('file_name');
                var baseName = nameInput.value || nameInput.placeholder || 'output';
                download(baseName + '.swap.3mf', URL.createObjectURL(outBlob));
                update_progress(100);
                setTimeout(() => update_progress(-1), 1000);
            });
        });
    }

    function disable_gcode_line(str, pos) { if (pos >= str.length) return str; return str.substring(0, pos) + ';' + str.substring(pos + 1); }

    function disable_gcode_block(str, pos) {
        if (pos >= str.length) return str;
        var end = str.substring(pos).search(/\n[^\s]/);
        var comment = ";SWAP - AMS block removed";
        while (comment.length < end - 1) comment += "/";
        return str.substring(0, pos) + comment + "\n" + str.substring(pos + end);
    }

    function chunked_md5(blob, callback) {
        var slice = File.prototype.slice || File.prototype.mozSlice || File.prototype.webkitSlice;
        var chunkSize = 2097152;
        var chunks = Math.ceil(blob.size / chunkSize);
        var current = 0;
        var spark = new SparkMD5.ArrayBuffer();
        var reader = new FileReader();

        function loadNext() {
            var start = current * chunkSize;
            var end = start + chunkSize >= blob.size ? blob.size : start + chunkSize;
            reader.readAsArrayBuffer(slice.call(blob, start, end));
        }
        reader.onload = function(e) {
            spark.append(e.target.result);
            update_progress(25 + 50 / chunks * ++current);
            if (current < chunks) loadNext();
            else callback(spark.end());
        };
        reader.onerror = function() { console.warn('MD5 read error'); };
        loadNext();
    }

    function download(filename, url) {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function update_statistics() {
        update_filament_usage();
        update_total_time();
    }

    function update_filament_usage() {
        var usedM = [],
            usedG = [],
            maxSlot = -1;
        var container = document.getElementById('filament_total');
        var filElements = playlist_ol.getElementsByClassName('p_filament');
        for (var f = 0; f < filElements.length; f++) {
            var slot = parseInt(filElements[f].querySelector('.f_slot').innerText) - 1;
            var repeats = parseInt(filElements[f].parentElement.parentElement.querySelector('.p_rep').value) || 0;
            var m = parseFloat(filElements[f].querySelector('.f_used_m').innerText) || 0;
            var g = parseFloat(filElements[f].querySelector('.f_used_g').innerText) || 0;
            if (!usedM[slot]) usedM[slot] = 0;
            if (!usedG[slot]) usedG[slot] = 0;
            usedM[slot] += m * repeats;
            usedG[slot] += g * repeats;
            if (repeats > 0 && slot > maxSlot) maxSlot = slot;
        }
        var loops = parseInt(document.getElementById('loops').value) || 1;
        usedM = usedM.map(v => v * loops);
        usedG = usedG.map(v => v * loops);
        container.innerHTML = '';
        for (var i = 0; i < usedM.length; i++) {
            if (usedM[i] || usedG[i]) {
                var div = document.createElement('div');
                div.innerHTML = '槽 ' + (i + 1) + ': <br>' + Math.round(usedM[i] * 100) / 100 + 'm <br> ' + Math.round(usedG[i] * 100) / 100 + 'g';
                div.title = i + 1;
                container.appendChild(div);
            }
        }
    }

    function update_total_time() {
        var totalTime = document.getElementById('total_time');
        var loops = parseInt(document.getElementById('loops').value) || 1;
        var usedPlates = document.getElementById('used_plates');
        var totalSec = 0,
            plateCount = 0;
        var items = playlist_ol.getElementsByTagName('li');
        for (var i = 0; i < items.length; i++) {
            var rep = parseInt(items[i].querySelector('.p_rep').value) || 0;
            if (rep > 0) {
                var t = parseFloat(items[i].querySelector('.p_time').title) || 0;
                totalSec += t * rep;
                plateCount += rep;
                items[i].classList.remove('inactive');
            } else {
                items[i].classList.add('inactive');
            }
        }
        totalSec *= loops;
        plateCount *= loops;
        totalTime.innerText = totalSec.toDHMS ? totalSec.toDHMS() : totalSec + 's';
        usedPlates.innerText = plateCount;
    }

    function makeListSortable(list) {
        list.classList.add('slist');
        let items = list.getElementsByTagName('li');
        let dragged = null;
        for (let li of items) {
            li.draggable = true;
            li.ondragstart = (e) => {
                dragged = li;
                li.classList.add('targeted');
                for (let other of items)
                    if (other !== li) other.classList.add('hint');
            };
            li.ondragenter = () => { if (li !== dragged) li.classList.add('active'); };
            li.ondragleave = () => { li.classList.remove('active'); };
            li.ondragend = () => {
                for (let el of items) el.classList.remove('hint', 'active', 'targeted');
            };
            li.ondragover = e => e.preventDefault();
            li.ondrop = (e) => {
                e.preventDefault();
                if (li === dragged) return;
                let fromIdx = 0,
                    toIdx = 0;
                for (let i = 0; i < items.length; i++) {
                    if (dragged === items[i]) fromIdx = i;
                    if (li === items[i]) toIdx = i;
                }
                if (fromIdx < toIdx) li.parentNode.insertBefore(dragged, li.nextSibling);
                else li.parentNode.insertBefore(dragged, li);
            };
        }
    }

    Number.prototype.toDHMS = function() {
        var sec = Math.floor(this);
        var d = Math.floor(sec / 86400);
        var h = Math.floor((sec - d * 86400) / 3600);
        var m = Math.floor((sec - d * 86400 - h * 3600) / 60);
        var s = sec - d * 86400 - h * 3600 - m * 60;
        return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm ' + s + 's';
    };

    window.export_3mf = export_3mf;
    window.custom_file_name = custom_file_name;
    window.adj_field_length = adj_field_length;
    window.update_statistics = update_statistics;
</script>

</body></html>
